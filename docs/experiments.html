<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSpec 实验记录(静态 TensorBoard 快照)</title>
<style>
  :root{--bg:#f7f7f5;--card:#fff;--ink:#1a1a1a;--sub:#666;--line:#e0e0e0;--accent:#2563eb;--grid:#eee;--chip:#eef2ff;--chipink:#3730a3}
  @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#1a1d24;--ink:#e8e8e8;--sub:#9aa0aa;--line:#2a2e37;--grid:#242832;--chip:#1e293b;--chipink:#93c5fd}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:18px 20px 8px;max-width:1200px;margin:0 auto}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--sub);font-size:13px}
  .layout{max-width:1200px;margin:0 auto;padding:12px 20px 60px;display:grid;grid-template-columns:300px 1fr;gap:20px}
  @media(max-width:820px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .panel h2{font-size:14px;margin:0 0 10px}
  label.metric{display:block;font-size:12px;color:var(--sub);margin:0 0 4px}
  select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font-size:13px}
  .opts{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .opts button,.grpbtn{font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
  .runs{margin-top:12px;max-height:60vh;overflow:auto}
  .grp{margin-bottom:6px}
  .grp>.ghead{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub);padding:4px 2px;cursor:pointer}
  .run{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:2px 2px 2px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .run i{width:11px;height:11px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(128,128,128,.4)}
  .run input{margin:0}
  .chartwrap{min-height:420px}
  svg{width:100%;height:auto;display:block;overflow:visible}
  .tick{fill:var(--sub);font-size:10px}
  .legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px;font-size:12px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:12px;height:3px;border-radius:2px}
  .empty{color:var(--sub);padding:40px;text-align:center}
  code{background:rgba(128,128,128,.15);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>DeepSpec 训练实验记录 · 静态 TensorBoard 快照</h1>

<div class="sub" style="margin-top:6px"><a href="index.html" style="color:var(--accent)">← 返回精选看板(V24 loss 分解 / 吞吐排序)</a></div>

const GROUPS={};RUNS.forEach(r=>{(GROUPS[groupOf(r)]=GROUPS[groupOf(r)]||[]).push(r)});
// 颜色
const PALETTE=['#2563eb','#dc2626','#16a34a','#9333ea','#ea580c','#0891b2','#ca8a04','#db2777','#4f46e5','#059669','#b45309','#7c3aed','#0d9488','#e11d48','#2563eb'];
const colorOf={};RUNS.forEach((r,i)=>colorOf[r]=PALETTE[i%PALETTE.length]);
let selected=new Set(RUNS.filter(r=>KEY.includes(r)));
let metric=TAGS.includes('train/loss')?'train/loss':TAGS[0];
let ylog=false;

// UI: metric 下拉
const msel=document.getElementById('metric');
TAGS.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;msel.appendChild(o)});
msel.value=metric;
msel.onchange=()=>{metric=msel.value;render()};
document.getElementById('logtoggle').onclick=e=>{ylog=!ylog;e.target.textContent='对数 Y:'+(ylog?'开':'关');render()};
document.getElementById('selnone').onclick=()=>{selected.clear();syncChecks();render()};
document.getElementById('selkey').onclick=()=>{selected=new Set(RUNS.filter(r=>KEY.includes(r)));syncChecks();render()};

// UI: run 列表(分组)
const runsEl=document.getElementById('runs');
Object.keys(GROUPS).sort().forEach(g=>{
  const box=document.createElement('div');box.className='grp';
  box.innerHTML=`<div class="ghead"><span>${g} (${GROUPS[g].length})</span><span class="grpbtn" data-g="${g}">切换</span></div>`;
  GROUPS[g].forEach(r=>{
    const row=document.createElement('label');row.className='run';row.title=r;
    row.innerHTML=`<input type="checkbox" data-run="${r}" ${selected.has(r)?'checked':''}><i style="background:${colorOf[r]}"></i><span>${r}</span>`;
    box.appendChild(row);
  });
  runsEl.appendChild(box);
});
runsEl.addEventListener('change',e=>{const r=e.target.dataset.run;if(r){e.target.checked?selected.add(r):selected.delete(r);render()}});
runsEl.addEventListener('click',e=>{const g=e.target.dataset.g;if(g){const on=GROUPS[g].some(r=>!selected.has(r));GROUPS[g].forEach(r=>on?selected.add(r):selected.delete(r));syncChecks();render()}});
function syncChecks(){runsEl.querySelectorAll('input[data-run]').forEach(c=>c.checked=selected.has(c.dataset.run))}

function render(){
  document.getElementById('chartTitle').textContent=metric;
  const runs=[...selected].filter(r=>DATA[r]&&DATA[r][metric]&&DATA[r][metric].length);
  const chart=document.getElementById('chart'),leg=document.getElementById('legend');
  if(!runs.length){chart.innerHTML='<div class="empty">没有选中的 run 含此指标</div>';leg.innerHTML='';return}
  const W=760,H=420,PL=60,PR=16,PT=14,PB=34;
  const all=runs.flatMap(r=>DATA[r][metric]);
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
  let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  if(xmin===xmax)xmax=xmin+1;
  if(ylog){const pos=ys.filter(v=>v>0);ymin=pos.length?Math.min(...pos):1e-6}
  if(ymin===ymax){ymax=ymin+Math.abs(ymin||1)*0.5+1e-9}
  if(!ylog){const pad=(ymax-ymin)*0.08;ymin-=pad;ymax+=pad}
  const fx=x=>PL+(x-xmin)/(xmax-xmin)*(W-PL-PR);
  const fy=y=>{if(ylog){const lo=Math.log10(Math.max(ymin,1e-9)),hi=Math.log10(Math.max(ymax,1e-9));return PT+(1-(Math.log10(Math.max(y,1e-9))-lo)/((hi-lo)||1))*(H-PT-PB)}return PT+(1-(y-ymin)/((ymax-ymin)||1))*(H-PT-PB)};
  let g='';
  for(let i=0;i<=4;i++){const yv=ymin+(ymax-ymin)*i/4,yy=PT+(1-i/4)*(H-PT-PB);g+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--grid)"/>`;g+=`<text class="tick" x="${PL-6}" y="${yy+3}" text-anchor="end">${fmt(ymin+(ymax-ymin)*i/4)}</text>`}
  const xt=xmax<=20?[...Array(Math.min(xmax,10)).keys()].map(i=>Math.round(xmin+(xmax-xmin)*i/9)):[xmin,Math.round((xmin+xmax)/2),xmax];
  [...new Set(xt)].forEach(xv=>{g+=`<text class="tick" x="${fx(xv)}" y="${H-8}" text-anchor="middle">${xv}</text>`});
  g+=`<text class="tick" x="${(PL+W-PR)/2}" y="${H+2}" text-anchor="middle" opacity=".7">step</text>`;
  runs.forEach(r=>{const pts=DATA[r][metric];const c=colorOf[r];
    if(pts.length===1){g+=`<circle cx="${fx(pts[0][0]).toFixed(1)}" cy="${fy(pts[0][1]).toFixed(1)}" r="3.5" fill="${c}"/>`;return}
    const d=pts.map((p,j)=>(j?'L':'M')+fx(p[0]).toFixed(1)+' '+fy(p[1]).toFixed(1)).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/>`});
  chart.innerHTML=`<svg viewBox="0 0 ${W} ${H+6}" role="img">${g}</svg>`;
  leg.innerHTML=runs.map(r=>`<span><i style="background:${colorOf[r]}"></i>${r}</span>`).join('');
}
function fmt(v){if(v===0)return '0';const a=Math.abs(v);if(a>=1000)return v.toExponential(1);if(a>=10)return v.toFixed(0);if(a>=1)return v.toFixed(2);if(a>=0.001)return v.toFixed(3);return v.toExponential(0)}
render();
</script>
</body>
</html>
